# CI pipeline for the Fitness Tracker monorepo.
#
# Required checks to merge (configure in GitHub → Settings → Branch rules):
#   ✅  Frontend CI / Lint    — oxlint must pass
#   ✅  Frontend CI / Build   — vite build must succeed
#
# Add  Frontend CI / Test  to required checks once you wire up Vitest.
#
# CD (Continuous Deployment) is handled by Vercel:
#   • Push to main       → production deployment (fitness-tracker.vercel.app)
#   • Open a PR          → preview deployment (unique URL posted to the PR)
#   See frontend/vercel.json for SPA routing configuration.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"

# Cancel redundant runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Front-end: lint → test → build
  # ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Lint (required to merge) ──────────────
      - name: Lint
        run: npm run lint

      # ── Tests (skipped until Vitest is added) ─
      # Uncomment this block and add  "test": "vitest run"  to package.json
      # scripts when you're ready. Then add  Frontend CI / Test  to your
      # branch-protection required-status-checks list.
      #
      # - name: Test
      #   run: npm test

      # ── Build (required to merge) ─────────────
      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # Back-end image (Week 11 — uncomment when ready)
  # ─────────────────────────────────────────────
