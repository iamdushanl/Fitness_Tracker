# CI pipeline for the Fitness Tracker monorepo.
#
# Required checks to merge (configure in GitHub → Settings → Branch rules):
#   ✅  Frontend CI / Lint    — oxlint must pass
#   ✅  Frontend CI / Build   — vite build must succeed
#
# Add  Frontend CI / Test  to required checks once you wire up Vitest.
#
# CD (Continuous Deployment) is handled by Vercel:
#   • Push to main       → production deployment (fitness-tracker.vercel.app)
#   • Open a PR          → preview deployment (unique URL posted to the PR)
#   See frontend/vercel.json for SPA routing configuration.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/ci.yml"

# Cancel redundant runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Front-end: lint → test → build
  # ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Lint (required to merge) ──────────────
      - name: Lint
        run: npm run lint

      # ── Tests (skipped until Vitest is added) ─
      # Uncomment this block and add  "test": "vitest run"  to package.json
      # scripts when you're ready. Then add  Frontend CI / Test  to your
      # branch-protection required-status-checks list.
      #
      # - name: Test
      #   run: npm test

      # ── Build (required to merge) ─────────────
      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # Back-end: build → push to ECR → deploy to ECS
  # Triggers only when backend/** files change on main.
  #
  # Required GitHub Secrets (repo Settings → Secrets → Actions):
  #   AWS_ACCESS_KEY_ID       — IAM user access key
  #   AWS_SECRET_ACCESS_KEY   — IAM user secret key
  #   AWS_REGION              — e.g. us-east-1
  #   ECR_REGISTRY            — ACCOUNT.dkr.ecr.REGION.amazonaws.com
  #   ECR_REPOSITORY          — fitness-backend
  #   ECS_CLUSTER             — e.g. default
  #   ECS_SERVICE             — e.g. fitness-backend-9c50
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Build & push backend → deploy ECS
    runs-on: ubuntu-latest
    # Only run on pushes to main (not on PRs — PRs just run frontend-ci)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest ./backend
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Force new ECS deployment
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text
          echo "✅ ECS deployment triggered for $SERVICE"

